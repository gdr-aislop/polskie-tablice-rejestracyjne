name: Release

# Buduje APK i dołącza go do wydania na GitHubie:
# - po wypchnięciu tagu pasującego do "v*" (np. v1.0.0) — tworzy wydanie, jeśli jeszcze nie istnieje,
# - albo po opublikowaniu wydania (Release) utworzonego ręcznie w GitHubie.
#
# APK jest budowany jako wariant "debug", podpisany efemerycznym kluczem
# debug generowanym automatycznie przez Android Gradle Plugin — dzięki temu
# da się go od razu zainstalować (sideload) bez zarządzania żadnymi sekretami.
# To NIE jest klucz nadający się do publikacji w Google Play.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK for release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/tablice-pl-${GITHUB_REF_NAME}.apk"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
